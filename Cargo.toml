[package]
name = "bpm-key"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Tempo (BPM) and musical key detection for audio, with loudness and timbre descriptors, in pure Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["bpm", "key-detection", "tempo", "music", "audio"]
categories = ["multimedia::audio"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/Cargo.toml",
    "/rustfmt.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[[bin]]
name = "bpm-key"
path = "src/bin/bpm-key.rs"
required-features = ["cli"]

[[example]]
name = "analyze_file"
required-features = ["decode"]

[[test]]
name = "decode"
required-features = ["decode"]

[[test]]
name = "cli"
required-features = ["cli"]

[[test]]
name = "eval"
required-features = ["mp3"]

[features]
default = ["decode"]
# `decode-core` is the decoding API without any formats; the format features pull it in.
decode = ["mp3", "wav", "flac", "ogg", "aac"]
mp3 = ["decode-core", "symphonia/mp3"]
wav = ["decode-core", "symphonia/wav", "symphonia/pcm"]
flac = ["decode-core", "symphonia/flac"]
ogg = ["decode-core", "symphonia/ogg", "symphonia/vorbis"]
aac = ["decode-core", "symphonia/isomp4", "symphonia/aac"]
decode-core = ["dep:symphonia"]
serde = ["dep:serde"]
cli = ["decode", "serde", "dep:serde_json"]

[dependencies]
ebur128 = "0.1.10"
realfft = "3.5.0"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true, features = ["preserve_order"] }
symphonia = { version = "0.6.1", default-features = false, features = ["id3v2", "opt-simd-sse", "opt-simd-avx"], optional = true }

[dev-dependencies]
rayon = "1"
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
